# ===================================================================
#  ATK-DAP (ALIENTEK DAP) interface config for OpenOCD
# ===================================================================
#
#  WHY THIS FILE IS NEEDED (instead of interface/cmsis-dap.cfg):
#
#  1) The ALIENTEK ATK-DAP enumerates as USB VID 04D8 / PID 00DF
#     (Microchip VID, device serial starts with "ATK-").
#     It only exposes a HID interface - there is no USB bulk endpoint.
#
#  2) OpenOCD's cmsis-dap driver defaults to backend "auto", and "auto"
#     tries usb_bulk FIRST. When that fails it exits immediately, it does
#     NOT fall back to hid. Result:
#         Error: unable to find a matching CMSIS-DAP device
#
#  3) Therefore the hid backend must be selected explicitly.
#
#  VERIFIED OUTPUT (OpenOCD 0.12.0+dev, ATK-DAP FW 2.0.0, STM32F407ZET6):
#     Info : CMSIS-DAP: SWD supported
#     Info : CMSIS-DAP: Atomic commands supported
#     Info : CMSIS-DAP: FW Version = 2.0.0
#     Info : CMSIS-DAP: Interface Initialised (SWD)
#     Info : SWD DPIDR 0x2ba01477
#     Info : [stm32f4x.cpu] Cortex-M4 r0p1 processor detected
#     Info : device id = 0x101f6413
#     Info : flash size = 1024 KiB
#
# ===================================================================

adapter driver cmsis-dap

# THE KEY LINE: force the HID backend (ATK-DAP speaks HID)
cmsis-dap backend hid

# SWD transport (STM32F4 uses SWD, not JTAG)
transport select swd

# Debug clock 1 MHz. Lower to 500 if you use long ribbon cables or see errors;
# raise to 2000 for faster flashing.
adapter speed 1000

# If several CMSIS-DAP probes are plugged in, uncomment and set the serial:
# adapter serial ATK-03262021
